name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # debug.keystore.base64 a été retiré du dépôt (un keystore versionné, même de debug, est un
      # secret exposé) ; or la signingConfig debugConfig exige ${rootDir}/debug.keystore, ce qui
      # faisait échouer TOUS les builds sur validateSigningDebug. Un keystore de debug jetable,
      # généré à la volée, suffit pour un APK de CI — seule la release utilise le vrai keystore
      # (release.yml, injecté depuis les secrets GitHub).
      - name: Provision debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64 to debug.keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating throwaway debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up local environments
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          touch local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Exécute notamment Migration20To21Test, qui rejoue la migration de schéma sur une base
      # v20 peuplée : si une future modification casse la préservation des données à la mise à
      # jour, la CI échoue ici plutôt que chez un client.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: varotra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
