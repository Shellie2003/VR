name: Desktop — compilation et paquets

# Chaîne de build de la version de bureau (Compose Multiplatform sur JVM).
#
# Workflow SÉPARÉ de `verification.yml` à dessein, et non une étape ajoutée dedans. Deux raisons,
# toutes deux tirées de l'expérience de ce dépôt :
#  1. Les deux chaînes tombent en panne pour des motifs sans rapport (SDK Android d'un côté,
#     `jpackage` et outils natifs de l'autre). Mélangées, une case rouge ne dit plus laquelle est
#     cassée — c'est exactement ce qui avait conduit à séparer compilation et tests dans
#     `verification.yml`.
#  2. Les deux tournent EN PARALLÈLE sur les mêmes déclencheurs : vérifier le desktop ne retarde
#     donc pas le retour de la vérification Android.

on:
  # Même déclencheur que `verification.yml` : une poussée sur la branche de travail doit dire si le
  # desktop compile toujours, sans attendre une Pull Request.
  push:
    branches: [ "claude/**" ]
  pull_request:
    branches: [ "main", "master" ]
  # Déclenchement manuel, avec la possibilité de demander les paquets natifs des trois systèmes.
  workflow_dispatch:
    inputs:
      paquets_natifs:
        # Défaut à `true` : un déclenchement manuel EST la demande de paquet. Laisser `false`
        # obligeait à cocher une case pour obtenir la seule chose qu'on vient chercher ici.
        # Le libellé disait « Linux, Windows, macOS » alors que la matrice est réduite à Windows
        # depuis la section 77 — un libellé faux est pire qu'absent, il fait attendre des fichiers
        # qui ne viendront pas.
        description: "Fabriquer le paquet Windows (archive portable + installateur)"
        type: boolean
        default: true

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # Barrière rapide. Une seule machine, pas d'empaquetage : répond en quelques minutes à la seule
  # question qui bloque une fusion — « le code de bureau compile-t-il, et ses tests passent-ils ? »
  # ---------------------------------------------------------------------------------------------
  verifier:
    name: Compilation et tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          # Le numéro de version du paquet vient de `git rev-list --count HEAD`. Un clone
          # superficiel (profondeur 1 par défaut) renverrait toujours 1 — la leçon est déjà
          # inscrite dans release.yml, et elle vaut ici aussi.
          fetch-depth: 0

      # Java 21 : `jpackage` exige au moins le JDK 14, et la vérification Android est déjà sous 21
      # (contrainte Robolectric). Aligner les deux évite un second JDK sur la machine.
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      # Le module :desktop n'en a pas besoin, mais Gradle CONFIGURE tous les modules du build avant
      # d'exécuter la moindre tâche : les signingConfigs de :app sont donc évalués, et un keystore
      # absent ferait échouer ce workflow pour un motif entièrement étranger au desktop.
      - name: Keystore jetable (exigé par la configuration de :app)
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Environnements locaux
        run: touch local.properties

      - name: Droit d'exécution sur gradlew
        run: chmod +x gradlew

      # Deux étapes séparées, même principe que verification.yml : un échec des tests ne doit pas
      # laisser planer le doute sur la compilation.
      - name: Compilation du module desktop
        run: ./gradlew :desktop:compileKotlin --no-daemon

      # `:core:ui:test` tourne aussi dans verification.yml, et c'est voulu : les écrans de bureau
      # vivent dans ce module, donc la chaîne desktop doit pouvoir se juger seule sans dépendre du
      # workflow Android — les deux tournent en parallèle, et chacun doit dire la vérité sur son
      # propre périmètre.
      - name: Tests du module desktop
        run: ./gradlew :desktop:test :core:ui:test --no-daemon

      - name: Résumé des tests
        if: always()
        run: |
          python3 - <<'PYTHON'
          import glob, xml.etree.ElementTree as ET
          total = echecs = 0
          fichiers = sorted(
              glob.glob('desktop/build/test-results/test/*.xml')
              + glob.glob('core/ui/build/test-results/test/*.xml')
          )
          if not fichiers:
              print("Aucun résultat de test : la tâche n'est pas allée jusque-là.")
          for chemin in fichiers:
              try:
                  racine = ET.parse(chemin).getroot()
              except Exception as e:
                  print(f"?      {chemin} illisible : {e}")
                  continue
              n = int(racine.get('tests') or 0)
              e = int(racine.get('failures') or 0) + int(racine.get('errors') or 0)
              total += n; echecs += e
              print(f"{'ECHEC' if e else 'ok':6} {racine.get('name')}  ({n} test(s), {e} échec(s))")
              for cas in racine.iter('testcase'):
                  for pb in list(cas.findall('failure')) + list(cas.findall('error')):
                      msg = ' '.join((pb.get('message') or pb.get('type') or '').split())[:220]
                      print(f"         -> {cas.get('name')} : {msg}")
          print(f"TOTAL {total} test(s), {echecs} échec(s)")
          PYTHON

  # ---------------------------------------------------------------------------------------------
  # Paquet natif — WINDOWS UNIQUEMENT.
  #
  # Décision de l'utilisateur, et elle est fondée : le parc de bureau des commerces visés est
  # massivement sous Windows. La chaîne a bel et bien produit les trois formats du premier coup
  # (.deb 55 Mo, .msi 58 Mo, .dmg 67 Mo), donc rien n'était cassé — mais faire tourner trois
  # machines pour deux paquets que personne n'installera reste du gaspillage.
  #
  # Rétablir Linux et macOS ne demande que de remettre leurs deux postes dans `matrix.include` :
  # le reste du job est déjà écrit pour être portable (`shell: bash` explicite, `keytool` en une
  # seule ligne, formats déclarés tous les trois dans `build.gradle.kts`). C'est pour cela que la
  # matrice est CONSERVÉE pour un seul système au lieu d'être supprimée.
  #
  # `jpackage` ne fabrique que le format de son propre système : un `.msi` exige donc bien une
  # machine Windows, aucune machine Linux ne peut le produire.
  #
  # Volontairement PAS déclenché à chaque poussée : sur demande, ou sur une étiquette de version.
  # ---------------------------------------------------------------------------------------------
  paquets:
    name: Paquet natif — ${{ matrix.etiquette }}
    needs: verifier
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.paquets_natifs) ||
      startsWith(github.ref, 'refs/tags/')

    # `fail-fast: false` conservé : il ne sert à rien avec un seul poste, mais il devient
    # immédiatement utile dès qu'un second système est rétabli — et on ne penserait pas à
    # le rajouter à ce moment-là.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            etiquette: windows

    runs-on: ${{ matrix.os }}

    # Nécessaire pour attacher les paquets à une Release : le jeton par défaut est en lecture seule
    # et refuserait l'envoi — leçon déjà apprise sur release.yml.
    permissions:
      contents: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      # `keytool` est fourni par le JDK, donc disponible sur les trois systèmes. La syntaxe
      # multi-lignes de shell n'est en revanche pas portable : une seule ligne fonctionne partout,
      # y compris sous PowerShell.
      - name: Keystore jetable (exigé par la configuration de :app)
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Environnements locaux
        run: touch local.properties
        shell: bash

      # Même formule que Gradle et que release.yml : le nombre de commits. Calculé ici une seule
      # fois et partagé par $GITHUB_ENV, pour que le nom de l'archive, celui de la pré-version et
      # celui du paquet ne puissent pas diverger d'une étape à l'autre.
      #
      # `fetch-depth: 0` plus haut est la condition de ce calcul : un clone superficiel renvoie
      # toujours 1, et toutes les versions porteraient alors le même numéro.
      - name: Calculer la version
        shell: bash
        run: echo "VERSION=1.0.$(git rev-list --count HEAD)" >> $GITHUB_ENV

      # Deux étapes, et c'est le choix important de ce job.
      #
      # `createDistributable` ne produit qu'une arborescence exécutable : il ne dépend d'aucun
      # outil d'empaquetage extérieur au JDK, et réussit donc sur les trois systèmes. C'est la
      # véritable barrière — elle prouve que le code de bureau s'assemble en application lançable.
      #
      # `packageDistributionForCurrentOS` fabrique l'installateur, et dépend d'outils du système
      # (WiX sous Windows, dpkg sous Linux) dont la présence sur les machines GitHub varie d'une
      # image à l'autre. Il est donc en « meilleur effort » : son échec signale un outil manquant,
      # pas un code cassé, et ne doit pas faire passer la barrière au rouge.
      - name: Assemblage de l'application (barrière)
        run: ./gradlew :desktop:createDistributable --no-daemon
        shell: bash

      # L'ARCHIVE PORTABLE, et c'est elle qui compte pour essayer l'application.
      #
      # Elle ne dépend QUE de l'étape précédente, donc du seul JDK : pas de WiX, pas
      # d'installateur, pas de droits administrateur sur le poste de l'utilisateur. On décompresse,
      # on double-clique `Varotra.exe`, et l'application s'ouvre. C'est aussi ce qui la rend
      # utilisable sur un poste d'épicerie où personne n'a le mot de passe administrateur.
      #
      # Le dossier est découvert au lieu d'être écrit en dur : son nom vient de `packageName` dans
      # `build.gradle.kts`, et un renommage là-bas casserait silencieusement un chemin figé ici.
      - name: Archive portable Windows (sans installation)
        id: portable
        shell: pwsh
        run: |
          $racine = "desktop/build/compose/binaries/main/app"
          $dossier = Get-ChildItem $racine -Directory | Select-Object -First 1
          if (-not $dossier) { throw "Aucune arborescence produite sous $racine" }
          # Accolades obligatoires : `$env:VERSION-windows` est ambigu pour l'analyseur
          # PowerShell, qui peut absorber le tiret dans le nom de variable. L'échec serait
          # SILENCIEUX — un nom tronqué que le filtre de publication ne ramasserait pas, donc une
          # Release sans l'archive, sans aucune erreur nulle part.
          $archive = "varotra-bureau-${env:VERSION}-windows-portable.zip"
          Compress-Archive -Path "$($dossier.FullName)/*" -DestinationPath $archive -Force
          Write-Host "Archive : $archive ($([math]::Round((Get-Item $archive).Length / 1MB, 1)) Mo)"
          Write-Host "Lanceur attendu dedans : $($dossier.Name).exe"

      - name: Installateur natif (meilleur effort)
        id: installateur
        continue-on-error: true
        run: ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon
        shell: bash

      # Ce qui a réellement été produit, avec la taille : c'est l'information qu'on vient chercher
      # dans le journal, et elle évite d'avoir à télécharger quoi que ce soit pour la connaître.
      #
      # Aucun envoi en artefact, délibérément : le stockage d'artefacts est un quota séparé, déjà
      # saturé sur ce compte, et son dépassement peut empêcher l'attribution des machines — donc
      # bloquer tous les workflows. Pour distribuer, une étiquette de version attache les paquets à
      # une Release GitHub (stockage distinct, sans ce quota), comme le fait déjà release.yml.
      - name: Ce qui a été produit
        if: always()
        shell: bash
        run: |
          echo "Installateur : ${{ steps.installateur.outcome }}"
          echo "--- Fichiers produits ---"
          find desktop/build/compose/binaries -maxdepth 4 \
            \( -name '*.deb' -o -name '*.msi' -o -name '*.dmg' -o -name '*.rpm' -o -name '*.exe' \) \
            -exec ls -lh {} \; 2>/dev/null || true
          echo "--- Arborescence exécutable ---"
          du -sh desktop/build/compose/binaries/main/app/* 2>/dev/null || true
          echo "--- Archive portable (toujours produite) ---"
          ls -lh varotra-bureau-*-windows-portable.zip 2>/dev/null || echo "ABSENTE - anormal, elle ne depend que du JDK"

      # Sur étiquette de version uniquement : les installateurs rejoignent la Release GitHub, à
      # côté de l'APK Android. Même mécanisme que release.yml, pour la même raison — c'est le seul
      # stockage durable et public du dépôt qui ne consomme pas le quota d'artefacts.
      # Publication, et c'est le changement qui rend la version de bureau RÉELLEMENT essayable.
      #
      # Auparavant cette étape n'existait que sur étiquette de version : un déclenchement manuel
      # fabriquait donc les fichiers, affichait leur taille dans le journal... et les jetait avec la
      # machine. Il n'y avait aucun moyen de récupérer l'application pour l'essayer, et l'envoi en
      # artefact n'en est pas un (quota séparé, déjà saturé sur ce compte — voir le commentaire de
      # l'étape précédente et la section 76).
      #
      # Une seule étape pour les deux cas, avec l'étiquette calculée, plutôt que deux étapes qui
      # répéteraient la liste des fichiers : une liste recopiée finit toujours par diverger.
      #  - sur étiquette de version : la Release normale, à côté de l'APK ;
      #  - sur déclenchement manuel : une PRÉ-version `bureau-v<version>`, marquée comme telle pour
      #    qu'elle ne se confonde pas avec une livraison client, et dont le nom est volontairement
      #    distinct des `v1.0.<n>` de l'APK Android.
      - name: Publier pour essai (Release GitHub)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('bureau-v{0}', env.VERSION) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Varotra bureau {0} (essai)', env.VERSION) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            Version de bureau de Varotra — ${{ env.VERSION }}, pour Windows.

            **Pour essayer sans rien installer** (le plus simple, et sans droits administrateur) :
            télécharger `varotra-bureau-${{ env.VERSION }}-windows-portable.zip`, le décompresser,
            puis double-cliquer `Varotra.exe` à l'intérieur.

            **Pour installer** : `Varotra-${{ env.VERSION }}.exe` (ou le `.msi`). Ces deux fichiers
            ne sont présents que si l'outil WiX était disponible sur la machine de construction ;
            l'archive portable, elle, est toujours produite.

            Ce que cette version fait aujourd'hui : l'écran Catalogue, calculé par le même code que
            la caisse Android (prix, prix de gros, mise en forme, filtrage). La caisse, les dettes
            et les rapports sont annoncés « à venir » dans le menu — ils attendent le partage de la
            base de données avec le téléphone. Les produits affichés sont des données de
            démonstration, ce que l'écran dit explicitement.
          # Les chemins des deux autres systèmes sont conservés bien que la matrice soit réduite à
          # Windows : `fail_on_unmatched_files: false` les rend inoffensifs, et ils évitent d'oublier
          # cette étape le jour où Linux ou macOS sont rétablis.
          files: |
            varotra-bureau-*-windows-portable.zip
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/dmg/*.dmg
          fail_on_unmatched_files: false
